[package]
name = "admin-authority"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[package.metadata.spel]
extension_attr = "admin_authority"

[[package.metadata.spel.inject]]
  wrapper = "admin_initialize"

[[package.metadata.spel.inject.account]]
  name = "admin_config"
  seed = [{ const = "admin_config" }]

[[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[[package.metadata.spel.inject]]
wrapper = "require_admin"

  [[package.metadata.spel.inject.account]]
  name = "admin_config"
  seed = { const = "admin_config" }

  [[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[package.metadata.spel.embedded]
skip = ["admin_initialize"]

[[package.metadata.spel.bound_args]]
arg = "offset"
from = "offset"
default = 0

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "86fb55e8d174a736cac40d20bc94a6d45df372d6" }
admin-authority-macros  = { path = "../admin-authority-macros"}
authority = { git = "https://github.com/mmlado/spel-authority.git", rev = "638506b96d50b043c0809735d4257017b2abdaf3", package = "spel-authority" }

[dev-dependencies]
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "86fb55e8d174a736cac40d20bc94a6d45df372d6", features = ["idl-gen"] }
