[package]
name = "admin-authority"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[package.metadata.spel]
extension_attr = "admin_authority"

[[package.metadata.spel.inject]]
  wrapper = "admin_initialize"

[[package.metadata.spel.inject.account]]
  name = "admin_config"
  seed = [{ const = "admin_config" }]

[[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[[package.metadata.spel.inject]]
wrapper = "require_admin"

  [[package.metadata.spel.inject.account]]
  name = "admin_config"
  seed = { const = "admin_config" }

  [[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[package.metadata.spel.embedded]
skip = ["admin_initialize"]
state_type = "admin_authority::AdminConfig"

[[package.metadata.spel.bound_args]]
arg = "offset"
from = "offset"
default = 0

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "dc0776659adb82b27fb11412778561159f442f9a" }
admin-authority-macros  = { path = "../admin-authority-macros"}
authority = { git = "https://github.com/mmlado/spel-authority.git", rev = "468778f1b85e3b37fdf5c8673ca907a52da1bbd7", package = "spel-authority" }

[dev-dependencies]
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "dc0776659adb82b27fb11412778561159f442f9a", features = ["idl-gen"] }
