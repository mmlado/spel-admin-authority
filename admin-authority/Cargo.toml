[package]
name = "admin-authority"
version.workspace = true
rust-version = "1.88"
description = "Single-admin authority extension for SPEL programs, transferable and renounceable admin with gated instructions"
repository = "https://github.com/mmlado/spel-admin-authority"
readme = "README.md"
edition.workspace = true
license.workspace = true

[package.metadata.spel]
extension_attr = "admin_authority"

[[package.metadata.spel.inject]]
  wrapper = "admin_initialize"

[[package.metadata.spel.inject.account]]
  name = "admin_config"
  seed = [{ const = "admin_config" }]

[[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[[package.metadata.spel.inject]]
wrapper = "require_admin"

  [[package.metadata.spel.inject.account]]
  name = "admin_config"
  seed = { const = "admin_config" }

  [[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[package.metadata.spel.embedded]
skip = ["admin_initialize"]
state_type = "admin_authority::AdminConfig"
anchor_attr = "admin_initialize"
anchor_role = "admin_config"

[[package.metadata.spel.bound_args]]
arg = "offset"
from = "offset"
default = 0

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "3d8307391b86786b7027e1fdd871ae6d37ccf321" }
admin-authority-macros  = { path = "../admin-authority-macros"}
authority = { git = "https://github.com/mmlado/spel-authority.git", branch = "feat/derived_embedding", package = "spel-authority" }

[dev-dependencies]
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "3d8307391b86786b7027e1fdd871ae6d37ccf321", features = ["idl-gen"] }
