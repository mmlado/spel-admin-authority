[package]
name = "admin-authority-sample-manual"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
borsh = { version = "1", features = ["derive"] }
admin-authority = { path = "../admin-authority" }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "98752095f45d405469f572668cd744c317fb8dad" }
