[package]
name = "admin-authority-sample-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
borsh = { version = "1", features = ["derive"] }
admin-authority = { path = "../admin-authority" }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "7a6181ce226a0a69bf619ec42a9999afee0305f3" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
trybuild = "1"
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "7a6181ce226a0a69bf619ec42a9999afee0305f3", features = ["idl-gen"] }
