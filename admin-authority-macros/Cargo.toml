[package]
name = "admin-authority-macros"
version = "0.1.0"
rust-version = "1.88"
description = "Proc-macro attributes for the admin-authority SPEL extension"
repository = "https://github.com/mmlado/spel-admin-authority"
readme = "README.md"
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }